name: Serial builds (MeshCore + EasySkyMesh power saving + serial.ondemand)

# 1. takes the newest stock MeshCore release (meshcore-dev/MeshCore, tags
#    repeater-/room-server-/companion-vX.Y.Z),
# 2. merges the power saving: by default our port of EasySkyMesh's power saving (branch
#    "powersaving-port"); optionally the source of EasySkyMesh's latest release instead
#    (IoTThinks/EasySkyMesh release PowerSaving17.1 -> IoTThinks/MeshCore branch PowerSaving-v17).
#    On merge conflicts the run fails, lists the conflicting files and opens an issue,
# 3. adds serial.ondemand and the headless Heltec V3 envs (serial/apply-serial.py),
# 4. builds every env and publishes release "vX.Y.Z-powersaving" (serial.ondemand and the
#    headless envs are listed as features).
# Runs on demand (Actions → Run workflow) and on every push to powersaving (the default
# branch). After "Sync fork" on main, press Run workflow. The scripts always come from
# the "powersaving" branch. It only builds when
# MeshCore, EasySkyMesh or the patch changed; otherwise the run ends after a few seconds.

on:
  push:
    branches: [powersaving]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stock version to build, e.g. v1.18.0 (blank = newest release)'
        required: false
      force:
        description: 'Rebuild even if the release already exists'
        type: boolean
        default: false
      powersaving:
        description: 'Power saving: port = our port (branch powersaving-port); easyskymesh-latest = merge the source of EasySkyMesh''s latest release; off = stock + serial.ondemand only'
        type: choice
        options: [port, easyskymesh-latest, off]
        default: port
      esm_ref:
        description: 'Override the power-saving source: a branch/tag/commit (in this repo for port, in IoTThinks/MeshCore for easyskymesh-latest)'
        required: false
      esm_conflicts:
        description: 'On merge conflicts'
        type: choice
        options: [fail, prefer-easyskymesh]
        default: fail

permissions:
  contents: write
  issues: write

concurrency:
  group: serial-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      upstream: ${{ steps.plan.outputs.upstream }}
      types: ${{ steps.plan.outputs.types }}
      sig: ${{ steps.plan.outputs.sig }}
      fwver: ${{ steps.plan.outputs.fwver }}
      esm_repo: ${{ steps.plan.outputs.esm_repo }}
      esm_ref: ${{ steps.plan.outputs.esm_ref }}
      esm_sha: ${{ steps.plan.outputs.esm_sha }}
      esm_release: ${{ steps.plan.outputs.esm_release }}
      esm_release_url: ${{ steps.plan.outputs.esm_release_url }}
      conflicts: ${{ steps.matrix.outputs.conflicts }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      envs: ${{ steps.matrix.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: powersaving
          path: fork
      - name: Find newest MeshCore and EasySkyMesh releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ inputs.version }}
          IN_FORCE: ${{ inputs.force }}
          IN_PS: ${{ inputs.powersaving }}
          IN_ESM_REF: ${{ inputs.esm_ref }}
        run: python3 fork/serial/plan_stock.py
      - uses: actions/setup-python@v5
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: '3.13'
      - name: Merge MeshCore + EasySkyMesh, apply serial.ondemand, list envs (fails on conflicts)
        id: matrix
        if: steps.plan.outputs.build == 'true'
        env:
          TYPES: ${{ steps.plan.outputs.types }}
          UP: ${{ steps.plan.outputs.upstream }}
          ESM_REPO: ${{ steps.plan.outputs.esm_repo }}
          ESM_SHA: ${{ steps.plan.outputs.esm_sha }}
          ESM_MODE: ${{ inputs.esm_conflicts == 'prefer-easyskymesh' && 'prefer' || 'fail' }}
        run: |
          pip install -q --upgrade platformio
          set +e
          M=$(python3 fork/serial/matrix_stock.py "$TYPES" 6); rc=$?
          set -e
          if [ "$rc" = 3 ]; then
            echo "conflicts=$(paste -sd, conflicts.txt)" >> "$GITHUB_OUTPUT"
            { echo "## Merge conflict: EasySkyMesh vs MeshCore"; echo; echo "Conflicting files:"; sed 's/^/- /' conflicts.txt; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::merging EasySkyMesh into MeshCore conflicts in $(wc -l < conflicts.txt) files; nothing built"
            exit 1
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "envs=$(cat envs-all.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: powersaving
          path: fork
      - name: Merge MeshCore + EasySkyMesh and apply serial.ondemand
        env:
          UP: ${{ needs.plan.outputs.upstream }}
          ESM_REPO: ${{ needs.plan.outputs.esm_repo }}
          ESM_SHA: ${{ needs.plan.outputs.esm_sha }}
          ESM_MODE: ${{ inputs.esm_conflicts == 'prefer-easyskymesh' && 'prefer' || 'fail' }}
        run: python3 fork/serial/source.py mc "${{ matrix.sha }}"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('mc/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --upgrade platformio
      - name: Build
        working-directory: mc
        env:
          FIRMWARE_VERSION: ${{ needs.plan.outputs.fwver }}
          ENVS: ${{ matrix.envs }}
        run: |
          # build.sh empties out/ on every call, so collect each env's files in ../dist
          mkdir -p ../dist
          for e in $ENVS; do
            echo "::group::$e"
            if bash build.sh build-firmware "$e"; then cp -v out/* ../dist/ 2>/dev/null || echo "::warning::$e produced no files"; else echo "::warning::$e failed"; fi
            echo "::endgroup::"
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.id }}
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [plan, build]
    if: always() && needs.plan.outputs.build == 'true' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: out
      - name: Check results
        id: check
        env:
          ENVS: ${{ needs.plan.outputs.envs }}
          VER: ${{ needs.plan.outputs.fwver }}
        run: |
          python3 - <<'PY'
          import json, os
          envs = json.loads(os.environ["ENVS"]); ver = os.environ["VER"]
          files = os.listdir("out") if os.path.isdir("out") else []
          failed = [e for e in envs if not any(f.startswith(f"{e}-{ver}-") for f in files)]
          open("failed.txt", "w").write("\n".join(failed))
          print(f"{len(files)} files, {len(envs) - len(failed)}/{len(envs)} envs built")
          if failed: print("failed: " + " ".join(failed))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"failed_count={len(failed)}\n")
          if not files or len(failed) * 2 > len(envs):
              raise SystemExit("too many envs failed to build; not publishing")
          if not any(f.startswith(f"Heltec_v3_repeater-{ver}-") for f in files):
              raise SystemExit("Heltec_v3_repeater did not build; not publishing")
          PY
          cd out && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VER: ${{ needs.plan.outputs.version }}
          UP: ${{ needs.plan.outputs.upstream }}
          TYPES: ${{ needs.plan.outputs.types }}
          SIG: ${{ needs.plan.outputs.sig }}
          FW: ${{ needs.plan.outputs.fwver }}
          ESM_REPO: ${{ needs.plan.outputs.esm_repo }}
          ESM_REF: ${{ needs.plan.outputs.esm_ref }}
          ESM_SHA: ${{ needs.plan.outputs.esm_sha }}
          ESM_REL: ${{ needs.plan.outputs.esm_release }}
          ESM_REL_URL: ${{ needs.plan.outputs.esm_release_url }}
        run: |
          if [ "$ESM_REPO" = "$GITHUB_REPOSITORY" ]; then TITLE="MeshCore ${VER} + power saving"
          elif [ -n "$ESM_SHA" ]; then TITLE="MeshCore ${VER} + EasySkyMesh ${ESM_REL:-$ESM_REF} + serial.ondemand"
          else TITLE="MeshCore ${VER} + serial.ondemand"; fi
          {
            echo "## ${TITLE}"
            echo
            echo "- MeshCore ${VER}: $(echo "$TYPES" | python3 -c 'import json,sys;print(", ".join(f"[{t["tag"]}]({t["url"]})" for t in json.load(sys.stdin)))')"
            if [ "$ESM_REPO" = "$GITHUB_REPOSITORY" ]; then
              echo "- Power saving: EasySkyMesh's power saving (PowerSaving 17.1 feature set, on MeshCore ${VER}) from branch [\`${ESM_REF}\`](https://github.com/${ESM_REPO}/tree/${ESM_REF}) (${ESM_SHA:0:7}): repeater/room server/sensor light sleep, RX duty-cycle (\`radio.rxps\`), GPS power saving, companion BLE sleep, button wake, \`reboot.interval\`. See [serial/README.md](https://github.com/${ESM_REPO}/blob/powersaving/serial/README.md)."
            elif [ -n "$ESM_SHA" ]; then
              echo "- EasySkyMesh power saving${ESM_REL:+ ([${ESM_REL}](${ESM_REL_URL}))}: [${ESM_REPO}@${ESM_REF}](https://github.com/${ESM_REPO}/commit/${ESM_SHA}) (${ESM_SHA:0:7}), merged in"
            fi
            echo
            echo "### Features"
            echo
            echo "- **serial.ondemand**: with \`powersaving on\`, a byte on the serial port (UART0 RX) wakes the board, and it stays awake 15 s after the last byte, so the serial CLI keeps working. Send a CR or LF first, wait about 100 ms, then the command."
            echo "  - \`set serial.ondemand on|off\` (default **on**), \`get serial.ondemand\`. Works over serial and remote admin. **off** = stock behaviour."
            echo "  - Applies to ESP32 boards whose serial port is a UART (e.g. Heltec V3). nRF52 and native-USB ESP32 boards are unchanged."
            echo "- **Headless Heltec V3 builds** (\`Heltec_v3_*_headless\`): no display, OLED held off from boot"
            echo
            echo "- Files: ESP32 \`<board>-${FW}-<commit>.bin\` = update (keeps identity and settings), \`...-merged.bin\` = fresh install (erases). nRF52: \`.zip\` (DFU) / \`.uf2\`."
            echo
            sed "s/__FW__/${FW}/g" <<'FLASH'
          ### How to flash

          **Web flasher (ESP32 and nRF52).** Open the official MeshCore web flasher, <https://flasher.meshcore.co.uk>, in **Chrome or Edge** on a desktop computer (it uses Web Serial; other browsers can't flash). Click **Custom Firmware**, pick the file you downloaded from the release, click **Flash!**, and choose the board's serial port when the browser asks.

          - **ESP32 (Heltec V3 and other ESP32 boards)**
            - **Update, keeps identity and settings:** the plain file, e.g. `Heltec_v3_repeater-__FW__-<commit>.bin` (no `-merged`). Leave **Erase device** unticked.
            - **Fresh install, erases identity (keys) and all settings:** the `-merged.bin` file. The flasher warns you and turns on erasing for it.
            - If the port doesn't appear, hold the **BOOT** button (labelled PRG on the Heltec V3) while plugging in the USB cable, then try again.
          - **nRF52 (RAK4631, Heltec T114, ...)**
            - `.zip` (DFU): flash it with **Custom Firmware** in the web flasher. If the board isn't in DFU mode yet, click **Enter DFU mode** first. Nordic/Adafruit DFU tools (e.g. `adafruit-nrfutil`) also take this file.
            - `.uf2`: put the board into its bootloader (usually a double press of reset) so it shows up as a USB drive, then drag the `.uf2` file onto that drive.
          - **Headless Heltec V3** (`Heltec_v3_repeater_headless`, `Heltec_v3_room_server_headless`, `Heltec_v3_companion_radio_usb_headless`, `Heltec_v3_companion_radio_ble_headless`): flash them exactly like the normal Heltec V3 files (plain `.bin` to update, `-merged.bin` for a fresh install). No display; the OLED is held off from boot to save power.

          **After flashing** (serial console at 115200 baud, or remote admin): `powersaving on` turns power saving on (a fresh install already defaults to on); `get serial.ondemand` should answer `on`, meaning the serial console keeps working while the board sleeps.

          ### Remote updates and dashboard (T-SIM)

          [tsim-remote-updater](https://github.com/just-stuff-tm/tsim-remote-updater) is a dashboard for a solar repeater with a LilyGO T-SIM (LTE) wired to the Heltec's serial port: telemetry, mesh status, repeater settings and the CLI, plus **over-the-air firmware updates over LTE**. These releases are its default update source. Press **Check for updates**, then **Update Heltec**; it always uses the plain `Heltec_v3_repeater-...bin` (never `-merged`), so identity and settings are kept. serial.ondemand is what lets the T-SIM reach the repeater's CLI while power saving is on.
          FLASH
            echo
            if [ -s failed.txt ]; then echo "Not built this time: $(tr '\n' ' ' < failed.txt)"; echo; fi
            echo "<sub>${SIG}</sub>"
          } > notes.md
          export TITLE
          # Create the release once (as a draft), never delete it, upload only the missing
          # assets one at a time with a pause and retry/backoff (GitHub's secondary rate
          # limit answers 403/429), then publish it as latest. A rerun picks up where it stopped.
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          T, R, TAG = os.environ["GH_TOKEN"], os.environ["GITHUB_REPOSITORY"], os.environ["TAG"]
          API = f"https://api.github.com/repos/{R}"
          def req(method, url, data=None, ctype="application/json", tries=10):
              delay = 10
              for _ in range(tries):
                  rq = urllib.request.Request(url, data=data, method=method, headers={
                      "Authorization": f"Bearer {T}", "Accept": "application/vnd.github+json",
                      "Content-Type": ctype, "User-Agent": "serial-build"})
                  try:
                      with urllib.request.urlopen(rq, timeout=600) as r:
                          b = r.read()
                          return r.status, (json.loads(b) if b else None)
                  except urllib.error.HTTPError as e:
                      body = e.read()[:200]
                      if e.code in (403, 429) or e.code >= 500:
                          ra = e.headers.get("retry-after")
                          wait = int(ra) if ra and ra.isdigit() else delay
                          if e.headers.get("x-ratelimit-remaining") == "0" and e.headers.get("x-ratelimit-reset"):
                              wait = max(wait, int(e.headers["x-ratelimit-reset"]) - int(time.time()) + 5)
                          print(f"  HTTP {e.code}, retrying in {wait}s: {body!r}", flush=True)
                          time.sleep(min(wait, 900)); delay = min(delay * 2, 600); continue
                      return e.code, body
                  except Exception as e:
                      print(f"  {e}, retrying in {delay}s", flush=True)
                      time.sleep(delay); delay = min(delay * 2, 600)
              raise SystemExit(f"giving up on {method} {url}")
          notes = open("notes.md").read()
          # drafts are not returned by /releases/tags/<tag>, so search the list
          rel = None
          for page in range(1, 6):
              st, lst = req("GET", f"{API}/releases?per_page=100&page={page}")
              if st != 200 or not lst: break
              rel = next((x for x in lst if x["tag_name"] == TAG), None)
              if rel: break
          if rel:
              print(f"release {TAG} exists (id {rel['id']}, draft={rel['draft']}); keeping it")
          else:
              st, rel = req("POST", f"{API}/releases", json.dumps({"tag_name": TAG,
                  "target_commitish": "powersaving", "name": os.environ["TITLE"],
                  "body": notes, "draft": True}).encode())
              if st != 201: raise SystemExit(f"could not create release: {st} {rel}")
              print(f"created draft release {TAG} (id {rel['id']})")
          rid = rel["id"]
          files = sorted(os.listdir("out"))
          have, page = {}, 1
          while True:
              st, assets = req("GET", f"{API}/releases/{rid}/assets?per_page=100&page={page}")
              if st != 200 or not assets: break
              for a in assets: have[a["name"]] = a
              page += 1
          for name, a in have.items():
              size = os.path.getsize(f"out/{name}") if name in files else None
              # drop broken uploads, stale files from an older build and same-named files that changed
              if a["state"] != "uploaded" or size is None or size != a["size"]:
                  print(f"removing asset {name}")
                  req("DELETE", f"{API}/releases/assets/{a['id']}"); time.sleep(1)
          have = {n for n, a in have.items() if a["state"] == "uploaded" and n in files
                  and os.path.getsize(f"out/{n}") == a["size"]}
          todo = [f for f in files if f not in have]
          print(f"{len(have)} assets already uploaded, {len(todo)} to upload")
          for i, f in enumerate(todo, 1):
              with open(f"out/{f}", "rb") as fh: data = fh.read()
              st, r = req("POST", f"https://uploads.github.com/repos/{R}/releases/{rid}/assets?name={urllib.parse.quote(f)}",
                          data, "application/octet-stream")
              if st == 422: print(f"  {f}: already there")
              elif st != 201: raise SystemExit(f"upload of {f} failed: {st} {r}")
              if i % 50 == 0: print(f"  {i}/{len(todo)}", flush=True)
              time.sleep(1.5)
          st, r = req("PATCH", f"{API}/releases/{rid}", json.dumps({"name": os.environ["TITLE"],
              "body": notes, "draft": False, "make_latest": "true"}).encode())
          if st != 200: raise SystemExit(f"could not publish: {st} {r}")
          print(f"published {r['html_url']} with {len(r['assets'])} assets")
          PY
      - name: Report envs that failed to build
        if: steps.check.outputs.failed_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Serial build ${TAG}: some boards failed to build" \
            --body "These envs failed: $(tr '\n' ' ' < failed.txt). Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || echo "::warning::could not open an issue (are Issues enabled on this repo?)"

  report-failure:
    needs: [plan, build, release]
    if: always() && (needs.plan.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          CONFLICTS: ${{ needs.plan.outputs.conflicts }}
          VER: ${{ needs.plan.outputs.version }}
          ESM_REPO: ${{ needs.plan.outputs.esm_repo }}
          ESM_REF: ${{ needs.plan.outputs.esm_ref }}
          ESM_SHA: ${{ needs.plan.outputs.esm_sha }}
        run: |
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$CONFLICTS" ]; then
            if [ "$ESM_REPO" = "$GITHUB_REPOSITORY" ]; then SRC="power-saving port (${ESM_REF})"; else SRC="EasySkyMesh ${ESM_REF}"; fi
            T="Sync conflict: ${SRC}@${ESM_SHA:0:7} vs MeshCore ${VER}"
            B="Merging ${ESM_REPO}@${ESM_REF} (${ESM_SHA}) into stock MeshCore ${VER} conflicts in these files, so nothing was built or released:
          $(echo "$CONFLICTS" | tr ',' '\n' | sed 's/^/- /')

          To fix (port): merge MeshCore ${VER} into the \`${ESM_REF}\` branch locally, resolve these files, push, then Run workflow.
          Other options: wait for an EasySkyMesh release based on MeshCore ${VER}; run the workflow with esm_ref set to a newer branch (e.g. PowerSaving-v18); run it with esm_conflicts = prefer-easyskymesh; or run it with powersaving = off (stock + serial.ondemand). Run: $URL"
            if [ -n "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$T\" in:title" --json number -q '.[].number' 2>/dev/null)" ]; then echo "issue already open"; exit 0; fi
            gh issue create -R "$GITHUB_REPOSITORY" --title "$T" --body "$B" || echo "::warning::could not open an issue (are Issues enabled on this repo?) — conflicts are listed in the run summary"
            exit 0
          fi
          T="Serial build failed${TAG:+ for $TAG}"
          if [ -n "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$T\" in:title" --json number -q '.[].number' 2>/dev/null)" ]; then
            echo "issue already open"; exit 0
          fi
          gh issue create -R "$GITHUB_REPOSITORY" --title "$T" --body "Nothing was released. If the 'List envs and check the patch applies' step failed, upstream changed the code serial.ondemand hooks into; update serial/apply-serial.py. Run: $URL" \
            || echo "::warning::could not open an issue (are Issues enabled on this repo?)"
